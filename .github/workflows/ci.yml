name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # contents: write is only actually exercised by the "Commit coverage
    # badge" step below, and only on a push to main — needed so that step
    # can push using the default GITHUB_TOKEN. A push made with that
    # token doesn't itself trigger another workflow run, so this can't
    # loop.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Sanity-checks the plain (non-Cloudflare) Next.js build still
      # works — the actual deploy build below is vinext's, but this is
      # the cheapest way to catch a regular Next.js regression too.
      - run: npm run build
      # Gated at "high" rather than every advisory: a moderate/low finding
      # in some transitive build-tool dependency (eslint's own toolchain,
      # tailwindcss's browserslist, etc.) shows up often in this ecosystem
      # and frequently has no fix yet — failing CI over those would just
      # train everyone to ignore this check. High/critical (the ones that
      # were actually live here — see the 2026-09-12 dependency bump
      # commit, which found real RCE/SSRF-class Next.js CVEs this way)
      # still blocks.
      - run: npm audit --audit-level=high
      # Self-hosted coverage badge — no external service/account (unlike
      # Codecov) needed, same approach as the backend repo. Re-runs the
      # suite once more with Node's own coverage flag (not folded into the
      # `npm test` step above, since coverage output is noisier and not
      # wanted on every local run) and takes the "all files" row's line-%
      # column as the single headline number. Written as a shields.io
      # "endpoint" JSON file, committed back to main only. README badge
      # points at it via https://img.shields.io/endpoint?url=<raw file URL>
      - name: Compute coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # A hiccup in badge generation is a cosmetic problem, not a
        # reason to fail this job (and block the deploy gated on it).
        continue-on-error: true
        run: |
          set -euo pipefail
          node --experimental-strip-types --experimental-loader=./scripts/tsx-test-loader.mjs \
            --experimental-test-module-mocks --experimental-test-coverage --test > /tmp/coverage.txt 2>&1 || true
          pct="$(grep '^ℹ all files' /tmp/coverage.txt | awk -F'|' '{print $2}' | tr -d ' ')"
          color="red"
          awk_ge() { awk -v a="$1" -v b="$2" 'BEGIN{exit !(a>=b)}'; }
          if awk_ge "$pct" 90; then color="brightgreen"
          elif awk_ge "$pct" 80; then color="green"
          elif awk_ge "$pct" 70; then color="yellowgreen"
          elif awk_ge "$pct" 60; then color="yellow"
          elif awk_ge "$pct" 50; then color="orange"
          fi
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > .github/badges/coverage.json
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          git add .github/badges/coverage.json
          # --cached (staged vs. HEAD), not a plain `git diff`, which
          # silently ignores untracked files entirely — that bug is
          # exactly why this never committed the badge's first run: the
          # file was brand new, so a plain `git diff --quiet` reported
          # "no changes" and skipped straight past the commit below.
          if git diff --cached --quiet -- .github/badges/coverage.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coverage badge [skip ci]"
          git push

  # Only on a real push to main, not PRs — a PR from a fork wouldn't
  # have access to the deploy secrets anyway, and we don't want every PR
  # touching production.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* vars are inlined into the browser bundle at build
    # time (see .env.production, which isn't committed) — set explicitly
    # here since CI doesn't have that local file.
    env:
      NEXT_PUBLIC_BACKEND_URL: https://api.brass-ledger.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:vinext
      - run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Catches a bad deploy immediately rather than silently. The
      # backend's own health/auth wiring is covered by its own
      # pipeline's smoke test (brass-ledger-api's scripts/smoke-test.sh)
      # — this just confirms the frontend itself is actually serving.
      - name: Smoke test production
        run: |
          sleep 5
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://brass-ledger.app/)"
          if [ "$code" != "200" ]; then
            echo "FAIL  frontend root (https://brass-ledger.app/ -> $code, want 200)" >&2
            exit 1
          fi
          echo "ok    frontend root (https://brass-ledger.app/ -> $code)"
