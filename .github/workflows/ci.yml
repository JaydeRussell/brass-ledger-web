name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # No coverage badge here (unlike the backend repo, which has one) —
  # reverted 2026-09-12 after the self-hosted approach (compute via
  # Node's --experimental-test-coverage, publish to a separate `badges`
  # branch) failed in CI with no useful error output, while the
  # identical approach worked fine on the backend. Suspected but not
  # confirmed: Node's test runner reporter may default differently when
  # stdout isn't a TTY (redirected to a file, as CI does), which would
  # silently change the output format my extraction grep depended on —
  # untested locally since a local terminal run is always a TTY. Revisit
  # if this is worth the effort again.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Sanity-checks the plain (non-Cloudflare) Next.js build still
      # works — the actual deploy build below is vinext's, but this is
      # the cheapest way to catch a regular Next.js regression too.
      - run: npm run build
      # Gated at "high" rather than every advisory: a moderate/low finding
      # in some transitive build-tool dependency (eslint's own toolchain,
      # tailwindcss's browserslist, etc.) shows up often in this ecosystem
      # and frequently has no fix yet — failing CI over those would just
      # train everyone to ignore this check. High/critical (the ones that
      # were actually live here — see the 2026-09-12 dependency bump
      # commit, which found real RCE/SSRF-class Next.js CVEs this way)
      # still blocks.
      - run: npm audit --audit-level=high
