# Split out from ci.yml (2026-09-12) so deploy never shows up (not even
# as "skipped") on a PR's checks list — it used to live in the same
# workflow file as test, gated by an `if:`, which meant every PR run
# still listed it as a skipped job.
#
# Triggered by the CI/CD workflow's own completion rather than sharing
# its `on: push` trigger, so this can gate on that workflow's overall
# conclusion without duplicating the test job here. The `ref` on
# checkout matters: a workflow_run-triggered run defaults to checking
# out whatever's on the default branch *right now*, not the commit the
# upstream run actually tested — github.event.workflow_run.head_sha
# pins it to the right one.
name: Deploy

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]

jobs:
  # Only after a CI/CD run triggered by a real push to main succeeds —
  # a PR from a fork wouldn't have access to the deploy secrets anyway,
  # and we don't want every PR touching production.
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* vars are inlined into the browser bundle at build
    # time (see .env.production, which isn't committed) — set explicitly
    # here since CI doesn't have that local file.
    env:
      NEXT_PUBLIC_BACKEND_URL: https://api.brass-ledger.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:vinext
      - run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Catches a bad deploy immediately rather than silently. The
      # backend's own health/auth wiring is covered by its own
      # pipeline's smoke test (brass-ledger-api's scripts/smoke-test.sh)
      # — this just confirms the frontend itself is actually serving.
      - name: Smoke test production
        run: |
          sleep 5
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://brass-ledger.app/)"
          if [ "$code" != "200" ]; then
            echo "FAIL  frontend root (https://brass-ledger.app/ -> $code, want 200)" >&2
            exit 1
          fi
          echo "ok    frontend root (https://brass-ledger.app/ -> $code)"
