version: 2
updates:
  # npm dependencies — grouped into one weekly PR for anything
  # patch/minor (the common case, low review burden) so this doesn't
  # turn into a PR per package; a major bump (like the Next.js one this
  # repo just did by hand) lands as its own PR since those are the ones
  # actually worth a closer look.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        update-types: ["minor", "patch"]

  # Keeps the CI workflow's own actions (checkout, setup-node, etc.)
  # current too — these don't show up in npm audit/npm updates since
  # they're not npm dependencies at all.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
